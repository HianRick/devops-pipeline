# Cluster kind usado pelo runner self-hosted.
# Expõe o NodePort 30080 do cluster em http://localhost:8080 na máquina.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30080
        hostPort: 8080
        listenAddress: "127.0.0.1"
        protocol: TCP
